<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estacionamento do Evento</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- POR QUE: header identifica a tela e fica separado da ação principal. -->
  <header class="cabecalho">
    <p class="marca">ESTACIONAMENTO DO EVENTO</p>
    <p class="status-conexao">CONTROLE DE ENTRADA</p>
  </header>

  <main>
    <!-- POR QUE: section agrupa a informação que Tiago precisa consultar em dois segundos. -->
    <section class="painel-vagas">
      <p class="rotulo">VAGAS</p>
      <p id="quantidade-vagas" class="quantidade">127/127</p>
      <p class="disponiveis">LIVRES / TOTAL</p>
      <p id="mensagem" class="mensagem">ENTRADA LIBERADA</p>
      <p id="confirmacao" class="confirmacao">AGUARDANDO AÇÃO</p>
    </section>

    <!-- COMPLETAR: escrever aqui, à mão, uma orientação curta para a equipe. -->
    <section class="acao">
      <!-- DECISAO SUA: deixei as ações separadas para evitar erro entre registrar e desfazer uma entrada. -->
      <button id="botao-entrada" class="botao-principal" type="button">REGISTRAR ENTRADA</button>
      <button id="botao-desfazer" class="botao-secundario" type="button">DESFAZER ÚLTIMA ENTRADA</button>
    </section>

    <!-- COMPLETAR: escrever aqui, à mão, o nome do responsável pelo controle. -->
    <!-- COMPLETAR: escrever aqui, à mão, o horário de atualização do painel. -->
  </main>

  <footer class="rodape">
    <p>Toque no botão quando o carro entrar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
