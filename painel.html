<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Metadados básicos da aplicação operacional. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Painel — Estacionamento do Evento</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Cabeçalho do painel e acesso de retorno à página de apresentação. -->
  <header class="cabecalho">
    <a class="marca" href="index.html" aria-label="Voltar para a apresentação do Estacionamento do Evento">ESTACIONAMENTO DO EVENTO</a>
    <p class="status-conexao"><span class="status-ponto" aria-hidden="true"></span> CONTROLE DE ENTRADA</p>
  </header>
  <!-- Área principal: mostra a capacidade e o estado atual do estacionamento. -->
  <main>
    <section class="painel-vagas" aria-labelledby="titulo-vagas">
      <p id="titulo-vagas" class="rotulo">VAGAS DISPONÍVEIS</p>
      <p id="quantidade-vagas" class="quantidade" aria-live="polite">50</p>
      <p id="capacidade-total" class="disponiveis">de 50 vagas totais</p>
      <p id="ocupacao" class="ocupacao">0 ocupadas</p>
      <p id="mensagem" class="mensagem mensagem-carregando" role="status">CARREGANDO DADOS...</p>
      <p id="confirmacao" class="confirmacao" role="status">Aguardando registro de entrada</p>
    </section>
    <!-- Área de ações: permite registrar, desfazer e registrar a saída de veículos. -->
    <section class="acao" aria-label="Ações do estacionamento">
      <button id="botao-entrada" class="botao-principal" type="button">REGISTRAR ENTRADA</button>
      <div class="acoes-secundarias">
        <button id="botao-desfazer" class="botao-secundario" type="button">DESFAZER ÚLTIMA ENTRADA</button>
        <button id="botao-saida" class="botao-secundario" type="button">REGISTRAR SAÍDA</button>
      </div>
      <p id="ultima-entrada" class="ultima-entrada">Nenhuma entrada registrada neste turno</p>
      <p class="orientacao"><strong>Pronto para registrar?</strong><br>Toque em “Registrar entrada” quando o veículo entrar.</p>
    </section>
    <!-- Indicador textual da última atualização do painel. -->
    <p class="ultima-atualizacao">Painel atualizado <span id="horario-atualizacao">agora</span></p>
  </main>
  <!-- Lógica da aplicação: atualiza vagas e responde aos botões do painel. -->
  <script src="script.js"></script>
</body>
</html>
